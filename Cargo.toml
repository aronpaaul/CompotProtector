[package]
name = "comprotector"
version = "0.1.0"
edition = "2021"

# GUI-зависимости вынесены в фичу "gui" и включены по умолчанию.
# Сборку движка/CLI без GUI можно проверять: cargo build --no-default-features
[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:rfd"]

[dependencies]
# Дизассемблер x86-64 для лифтера виртуализации (декодер инструкций)
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
# Кроссплатформенный GUI на egui (нужен только для графической версии)
eframe = { version = "0.27", optional = true, default-features = false, features = ["glow"] }
egui = { version = "0.27", optional = true }
# Нативные диалоги выбора файлов (input/output exe)
rfd = { version = "0.14", optional = true }

[profile.release]
opt-level = 3
lto = true
strip = true
